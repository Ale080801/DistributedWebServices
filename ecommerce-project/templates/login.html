<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GoFishing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #021a2f; /* Deep ocean navy */
            --surface-color: #073559; /* Submarine blue */
            --text-primary: #e0f2fe; /* Frost blue */
            --text-secondary: #9ca3af; /* Soft gray */
            --accent-color: #0ea5e9; /* Sky blue */
            --accent-hover: #0284c7;
            --card-border: rgba(14, 165, 233, 0.15);
        }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background-color: var(--surface-color);
            border: 1px solid var(--card-border);
            padding: 3rem;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h2 {
            margin-top: 0;
            font-size: 1.8rem;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: rgba(15, 23, 42, 0.5);
            color: white;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        .btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 0.75rem;
            width: 100%;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            margin-top: 0.5rem;
            display: inline-block;
            box-sizing: border-box;
            text-decoration: none;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            opacity: 1;
        }
        .error {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Login</h2>
        <p style="color: var(--text-secondary); margin-bottom: 2rem; font-size: 0.875rem;">Enter your credentials to continue.</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="e.g. admin@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="e.g. password123">
            </div>
            <button type="submit" class="btn">Login</button>
            <a href="/register" class="btn btn-secondary">Register</a>
            <div id="errorMsg" class="error">Invalid credentials or network error.</div>
        </form>
        
        <div style="margin-top: 2rem;">
            <a href="/" style="color: var(--text-secondary); text-decoration: none; font-size: 0.875rem;">&larr; Back to Shop</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            
            errorMsg.style.display = 'none';

            try {
                // Call our existing REST API
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    // Store userId in sessionStorage (per-tab) for cart isolation
                    const me = await fetch('/api/auth/me').then(r => r.json()).catch(() => ({}));
                    if (me.user_id) {
                        sessionStorage.setItem('userId', me.user_id);
                        localStorage.setItem('userEmail_' + me.user_id, email);
                    }
                    localStorage.removeItem('cart_guest'); // Clear guest cart
                    window.location.href = '/';
                } else {
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
