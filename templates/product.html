<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Product.Name}} - GoFishing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #021a2f; /* Deep ocean navy */
            --surface-color: #073559; /* Submarine blue */
            --text-primary: #e0f2fe; /* Frost blue */
            --text-secondary: #9ca3af; /* Soft gray */
            --accent-color: #0ea5e9; /* Sky blue */
            --accent-hover: #0284c7;
            --card-border: rgba(14, 165, 233, 0.15);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
        }

        header {
            padding: 1.5rem 5%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .container {
            max-width: 800px;
            margin: 4rem auto;
            padding: 0 5%;
        }

        .product-detail {
            background-color: var(--surface-color);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            border-radius: 999px;
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .title {
            font-size: 2.5rem;
            margin: 0;
            font-weight: 700;
        }

        .desc {
            color: var(--text-secondary);
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .price {
            font-size: 2rem;
            font-weight: 700;
            color: #10b981;
        }

        .btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .btn:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
        }

        .cart-status {
            margin-top: 1rem;
            color: #10b981;
            font-weight: 500;
            display: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            margin-left: 1rem;
        }

        .nav-links a:hover {
            color: white;
        }
    </style>
</head>

<body>
    <header>
        <h1><a href="/" style="text-decoration: none; color: inherit;">GoFishing</a></h1>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/orders">📦 Ordini</a>
            <a href="/cart" style="color: #60a5fa;">🛒 Cart (<span id="cartCount">0</span>)</a>
        </div>
    </header>

    <div class="container">
        <a href="/" style="color: var(--text-secondary); text-decoration: none; margin-bottom: 2rem; display: inline-block;">&larr; Back to Catalog</a>

        <div class="product-detail">
            <div><span class="badge">{{.Product.Category}}</span></div>
            <h2 class="title">{{.Product.Name}}</h2>
            <div class="price">€{{formatPrice .Product.PriceCents}}</div>
            <p class="desc">{{.Product.Description}}</p>

            <p style="color: var(--text-secondary);">
                Availability: 
                {{if eq .Product.Stock 0}}
                    <span style="color: #ef4444; font-weight: bold;">Out of Stock</span>
                {{else}}
                    <span style="color: #10b981;">{{.Product.Stock}} in stock</span>
                {{end}}
            </p>

            <button class="btn" id="addToCartBtn" {{if eq .Product.Stock 0}}disabled{{end}}>
                {{if eq .Product.Stock 0}}Unavailable{{else}}Add to Cart{{end}}
            </button>
            <div id="cartStatus" class="cart-status">✓ Added to cart!</div>
            
            <!-- Dati nascosti per il JavaScript (Evita errori di sintassi nell'IDE) -->
            <div id="productData" style="display:none;" 
                data-id="{{.Product.Id}}" 
                data-name="{{.Product.Name}}" 
                data-price="{{.Product.PriceCents}}"
                data-stock="{{.Product.Stock}}">
            </div>
        </div>
    </div>

    <script>
        // Cart key namespaced by user — isolates carts across different accounts
        function getCartKey() {
            const uid = sessionStorage.getItem('userId');
            return uid ? 'cart_' + uid : 'cart_guest';
        }

        const pd = document.getElementById('productData');
        const product = {
            id: parseInt(pd.dataset.id, 10),
            name: pd.dataset.name,
            price_cents: parseInt(pd.dataset.price, 10),
            stock: parseInt(pd.dataset.stock, 10)
        };

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem(getCartKey())) || [];
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').textContent = count;
            
            // Check stock limit for Add to Cart button
            const btn = document.getElementById('addToCartBtn');
            if (product.stock > 0 && btn) {
                const existing = cart.find(i => i.id === product.id);
                const currentQty = existing ? existing.quantity : 0;
                if (currentQty >= product.stock) {
                    btn.disabled = true;
                    btn.textContent = 'Max Stock Reached';
                } else {
                    btn.disabled = false;
                    btn.textContent = 'Add to Cart';
                }
            }
        }

        document.getElementById('addToCartBtn')?.addEventListener('click', () => {
            let cart = JSON.parse(localStorage.getItem(getCartKey())) || [];
            const existing = cart.find(i => i.id === product.id);
            const currentQty = existing ? existing.quantity : 0;
            
            if (currentQty >= product.stock) {
                alert("You cannot add more of this item to the cart.");
                return;
            }

            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            localStorage.setItem(getCartKey(), JSON.stringify(cart));
            updateCartCount();
            
            const status = document.getElementById('cartStatus');
            status.style.display = 'block';
            setTimeout(() => { status.style.display = 'none'; }, 2000);
        });

        // Initialize
        updateCartCount();
    </script>
</body>

</html>
